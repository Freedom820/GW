<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合管理平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z'/></svg>">
<script src="https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://fastly.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://fastly.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://fastly.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ===== 基础重置 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --sidebar-bg: #0f172a;
  --sidebar-text: #94a3b8;
  --sidebar-active: rgba(37, 99, 235, 0.15);
  --sidebar-active-text: #60a5fa;
  --main-bg: #f8fafc;
  --card-bg: #ffffff;
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --accent-hover: #1d4ed8;
  --danger: #dc2626;
  --warning: #d97706;
  --success: #16a34a;
  --info: #0891b2;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.04);
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 14px; color: var(--text-primary); background: var(--main-bg); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; font-size: 14px; outline: none; }

/* ===== 登录页 ===== */
.login-page {
  position: fixed; inset: 0; z-index: 1000;
  display: flex;
}
/* 左侧品牌区 */
.login-brand {
  flex: 1; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
  display: flex; flex-direction: column; justify-content: center; padding: 60px;
  position: relative; overflow: hidden;
}
.login-brand::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(59,130,246,.2) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(139,92,246,.15) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(14,165,233,.1) 0%, transparent 50%);
}
/* 浮动粒子 */
.particle {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,.1);
  animation: float 6s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0) translateX(0); opacity: .3; }
  50% { transform: translateY(-30px) translateX(10px); opacity: .6; }
}
.brand-content { position: relative; z-index: 1; }
.brand-logo {
  width: 64px; height: 64px; margin-bottom: 28px;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 24px rgba(59,130,246,.3);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 12px 24px rgba(59,130,246,.3); }
  50% { box-shadow: 0 12px 32px rgba(59,130,246,.5); }
}
.brand-logo svg { width: 32px; height: 32px; color: #fff; }
.brand-title {
  font-size: 42px; font-weight: 800; color: #fff; line-height: 1.2;
  margin-bottom: 16px; letter-spacing: -0.5px;
}
.brand-title span {
  background: linear-gradient(135deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand-desc {
  font-size: 16px; color: rgba(255,255,255,.6); line-height: 1.8;
  max-width: 420px; margin-bottom: 40px;
}
.brand-features { display: flex; flex-direction: column; gap: 14px; }
.brand-feature {
  display: flex; align-items: center; gap: 12px;
  color: rgba(255,255,255,.7); font-size: 14px;
}
.brand-feature .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #3b82f6; box-shadow: 0 0 8px #3b82f6;
}
/* 右侧登录表单区 */
.login-form-area {
  width: 480px; min-width: 480px; background: #fff;
  display: flex; flex-direction: column; justify-content: center;
  padding: 60px 56px;
}
.login-form-title { font-size: 26px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
.login-form-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 36px; }
.login-field { margin-bottom: 18px; }
.login-field label { display: block; color: var(--text-primary); font-size: 13px; margin-bottom: 8px; font-weight: 500; }
.login-input {
  width: 100%; padding: 12px 14px; background: #f8fafc;
  border: 1.5px solid var(--border); border-radius: 8px;
  color: var(--text-primary); font-size: 14px; transition: all .2s;
}
.login-input::placeholder { color: var(--text-muted); }
.login-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-light); }
.login-btn {
  width: 100%; padding: 13px; margin-top: 12px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: #fff; border-radius: 8px; font-size: 15px; font-weight: 600;
  transition: all .2s; box-shadow: 0 4px 12px rgba(59,130,246,.3);
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,.4); }
.login-btn:active { transform: translateY(0); }
.login-error { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center; }
.login-footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--text-muted); }

/* ===== 布局 ===== */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ===== 侧边栏 ===== */
.sidebar {
  width: 230px; min-width: 230px; background: var(--sidebar-bg);
  display: flex; flex-direction: column; color: var(--sidebar-text);
}
.sidebar-logo {
  padding: 20px 18px; font-size: 15px; font-weight: 700; color: #fff;
  border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 10px;
}
.sidebar-logo-icon {
  width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sidebar-logo-icon svg { width: 18px; height: 18px; color: #fff; }
.sidebar-nav { flex: 1; padding: 16px 10px; overflow-y: auto; }
.nav-section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: rgba(255,255,255,.3); padding: 0 12px; margin: 12px 0 6px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 8px; cursor: pointer; margin-bottom: 2px;
  color: var(--sidebar-text); transition: all .15s; font-size: 13.5px; font-weight: 500;
}
.nav-item:hover { background: rgba(255,255,255,.05); color: #e2e8f0; }
.nav-item.active { background: var(--sidebar-active); color: var(--sidebar-active-text); }
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; background: rgba(255,255,255,.12); border-radius: 10px;
  padding: 1px 8px; font-size: 11px; min-width: 20px; text-align: center; font-weight: 600;
}
.sidebar-user {
  padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.06);
  display: flex; align-items: center; gap: 10px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 600; flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name { color: #e2e8f0; font-size: 13px; font-weight: 500; }
.user-role { color: rgba(255,255,255,.4); font-size: 11px; }
.logout-btn {
  background: none; color: rgba(255,255,255,.4); font-size: 16px;
  padding: 4px 6px; border-radius: 4px; transition: all .15s;
}
.logout-btn:hover { color: #f87171; background: rgba(248,113,113,.1); }

/* ===== 主内容区 ===== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--main-bg); }
.main-header {
  background: var(--card-bg); border-bottom: 1px solid var(--border);
  padding: 16px 28px; display: flex; align-items: center; justify-content: space-between;
}
.main-title { font-size: 17px; font-weight: 700; color: var(--text-primary); }
.main-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.header-actions { display: flex; gap: 8px; align-items: center; }

/* ===== 按钮 ===== */
.btn {
  padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500;
  transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(37,99,235,.2); }
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 2px 4px rgba(37,99,235,.3); }
.btn-secondary { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border-light); border-color: #cbd5e1; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ===== 内容滚动区 ===== */
.content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* ===== 统计卡片 ===== */
.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow); border: 1px solid var(--border-light);
  position: relative; overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent);
}
.stat-card.severity-fatal::before { background: var(--danger); }
.stat-card.severity-critical::before { background: #ea580c; }
.stat-card.severity-normal::before { background: var(--warning); }
.stat-card.severity-minor::before { background: var(--info); }
.stat-card.severity-suggestion::before { background: var(--success); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
.stat-value { font-size: 28px; font-weight: 700; color: var(--text-primary); line-height: 1; }

/* ===== 筛选工具栏 ===== */
.filter-bar {
  background: var(--card-bg); border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  box-shadow: var(--shadow); border: 1px solid var(--border-light);
}
.filter-bar input[type="text"], .filter-bar select {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px;
  font-size: 13px; background: #fff; min-width: 130px; transition: all .15s;
}
.filter-bar input[type="text"] { flex: 1; min-width: 220px; }
.filter-bar input[type="text"]:focus, .filter-bar select:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light);
}

/* ===== 表格 ===== */
.table-wrap {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--border-light); overflow: hidden;
}
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
thead { background: #fafbfc; }
th {
  text-align: left; padding: 11px 14px; font-size: 12px; font-weight: 600;
  color: var(--text-secondary); border-bottom: 1px solid var(--border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-transform: uppercase; letter-spacing: .3px;
}
td {
  padding: 12px 14px; border-bottom: 1px solid var(--border-light);
  font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
tbody tr { cursor: pointer; transition: background .1s; }
tbody tr:hover { background: #f8fafc; }
tbody tr:last-child td { border-bottom: none; }

/* ===== 标签/徽章 ===== */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 11.5px; font-weight: 500; white-space: nowrap;
}
.badge-fatal { background: #fef2f2; color: var(--danger); }
.badge-critical { background: #fff7ed; color: #ea580c; }
.badge-normal { background: #fffbeb; color: var(--warning); }
.badge-minor { background: #ecfeff; color: var(--info); }
.badge-suggestion { background: #f0fdf4; color: var(--success); }
.badge-status-new { background: #eff6ff; color: var(--accent); }
.badge-status-processing { background: #fef3c7; color: #b45309; }
.badge-status-resolved { background: #dcfce7; color: #15803d; }
.badge-status-closed { background: #f1f5f9; color: var(--text-secondary); }
.badge-type-hardware { background: #f5f3ff; color: #7c3aed; }
.badge-type-firmware { background: #fef3c7; color: #b45309; }
.badge-type-app { background: #e0f2fe; color: #0369a1; }
.badge-type-compat { background: #fce7f3; color: #be185d; }
.badge-type-other { background: #f1f5f9; color: var(--text-secondary); }

/* ===== 表单 ===== */
.form-card { background: var(--card-bg); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); border: 1px solid var(--border-light); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.form-label .req { color: var(--danger); margin-left: 2px; }
.form-input, .form-select, .form-textarea {
  padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px;
  font-size: 14px; background: #fff; transition: all .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light);
}
.form-textarea { resize: vertical; min-height: 84px; line-height: 1.6; }
.form-hint { font-size: 12px; color: var(--text-muted); }

/* ===== 附件区 ===== */
.attach-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 28px 20px; text-align: center; color: var(--text-secondary);
  cursor: pointer; transition: all .15s; background: #fafbfc;
}
.attach-zone:hover { border-color: var(--accent); background: #f0f7ff; color: var(--accent); }
.attach-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.attach-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #f8fafc; border-radius: 7px; font-size: 13px; border: 1px solid var(--border-light);
}
.attach-item .icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.attach-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.attach-item .size { color: var(--text-muted); font-size: 12px; }
.attach-item .remove { color: var(--danger); cursor: pointer; font-size: 18px; padding: 2px 8px; border-radius: 4px; transition: background .15s; }
.attach-item .remove:hover { background: #fef2f2; }
.compress-toggle { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); margin-top: 10px; cursor: pointer; }

/* ===== 详情视图 ===== */
.detail-section { margin-bottom: 24px; }
.detail-section h3 {
  font-size: 13px; font-weight: 600; margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border-light);
  color: var(--text-primary); text-transform: uppercase; letter-spacing: .3px;
}
.detail-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; margin-bottom: 10px; font-size: 13.5px; }
.detail-row .label { color: var(--text-muted); font-weight: 500; }
.detail-row .value { color: var(--text-primary); white-space: pre-wrap; word-break: break-word; line-height: 1.6; }

/* ===== Toast ===== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
.toast {
  padding: 12px 18px; border-radius: 8px; font-size: 13.5px; color: #fff;
  box-shadow: var(--shadow-lg); animation: slideIn .25s ease; font-weight: 500;
}
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--accent); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ===== 空状态 ===== */
.empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
.empty-state svg { width: 72px; height: 72px; margin-bottom: 16px; opacity: .3; }
.empty-state p { font-size: 14px; }

/* ===== 进度提示 ===== */
.progress-overlay {
  position: fixed; inset: 0; background: rgba(248,250,252,.85);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 1500;
}
.progress-box {
  background: #fff; border-radius: 12px; padding: 32px 44px;
  box-shadow: var(--shadow-lg); text-align: center; min-width: 320px;
}
.progress-bar { height: 6px; background: var(--border-light); border-radius: 3px; margin-top: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb); border-radius: 3px; transition: width .3s; }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
  .sidebar { width: 64px; min-width: 64px; }
  .sidebar-logo span, .nav-item span, .nav-badge, .user-info, .nav-section-title { display: none; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
  .filter-bar input[type="text"], .filter-bar select,
  .form-input, .form-select, .form-textarea,
  .login-input { font-size: 16px; }
  .content { padding: 16px; }
  .main-header { padding: 14px 16px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { min-width: 600px; }
  .header-actions .btn { padding: 8px 12px; font-size: 13px; }
}

/* 统一空状态样式 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state svg {
  width: 48px;
  height: 48px;
  margin-bottom: 16px;
  opacity: 0.3;
}
.empty-state p {
  font-size: 14px;
  line-height: 1.6;
}

/* 保存按钮加载状态 */
.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 文档预览内容样式 */
.doc-content h1, .doc-content h2, .doc-content h3 {
  font-weight: 600;
  margin-top: 20px;
  margin-bottom: 12px;
  line-height: 1.4;
}
.doc-content h1 { font-size: 20px; }
.doc-content h2 { font-size: 17px; }
.doc-content h3 { font-size: 15px; }
.doc-content p {
  margin-bottom: 10px;
  line-height: 1.8;
}
.doc-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 13px;
}
.doc-content table td, .doc-content table th {
  border: 1px solid #d1d5db;
  padding: 8px 12px;
  text-align: left;
}
.doc-content table th {
  background: #f3f4f6;
  font-weight: 600;
}
.doc-content ul, .doc-content ol {
  padding-left: 24px;
  margin-bottom: 10px;
}
.doc-content li {
  margin-bottom: 6px;
  line-height: 1.7;
}
.doc-content strong {
  font-weight: 600;
}
.doc-content img {
  max-width: 100%;
  height: auto;
}
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-page" id="loginPage" style="display:none">
  <!-- 左侧品牌区 -->
  <div class="login-brand">
    <div class="particle" style="width:80px;height:80px;top:15%;left:10%;animation-delay:0s"></div>
    <div class="particle" style="width:40px;height:40px;top:60%;left:25%;animation-delay:1s"></div>
    <div class="particle" style="width:60px;height:60px;top:30%;right:15%;animation-delay:2s"></div>

// ==================== IndexedDB 封装 ====================
const DB_NAME = 'test_bug_tracker';
const DB_VERSION = 4;
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('bugs')) {
        const store = d.createObjectStore('bugs', { keyPath: 'id', autoIncrement: true });
        store.createIndex('createdAt', 'createdAt');
        store.createIndex('severity', 'severity');
        store.createIndex('status', 'status');
        store.createIndex('type', 'type');
      }
      if (!d.objectStoreNames.contains('attachments')) {
        d.createObjectStore('attachments', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('testcases')) {
        const store = d.createObjectStore('testcases', { keyPath: 'id', autoIncrement: true });
        store.createIndex('module', 'module');
        store.createIndex('priority', 'priority');
        store.createIndex('status', 'status');
      }
      if (!d.objectStoreNames.contains('firmware')) {
        d.createObjectStore('firmware', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('featurespec')) {
        d.createObjectStore('featurespec', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('uireview')) {
        d.createObjectStore('uireview', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('scripts')) {
        d.createObjectStore('scripts', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('compat')) {
        const store = d.createObjectStore('compat', { keyPath: 'id', autoIncrement: true });
        store.createIndex('os', 'os');
        store.createIndex('status', 'status');
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = (e) => reject(e.target.error);
  });
}

const SUPABASE_URL = 'https://edzpritjurrnsgsnbqii.supabase.co';

// 数据库操作统一封装（云数据库版）
async function dbAdd(storeName, data) {
  const { data: result, error } = await supabase
    .from(storeName)
    .insert(data)
    .select()
    .single();
  if (error) throw error;
  return result;
}
async function dbPut(storeName, data) {
  const { data: result, error } = await supabase
    .from(storeName)
    .upsert(data)
    .select()
    .single();
  if (error) throw error;
  return result;
}
async function dbGetAll(storeName) {
  const { data, error } = await supabase
    .from(storeName)
    .select('*')
    .order('id', { ascending: false });
  if (error) throw error;
  return data || [];
}
async function dbGet(storeName, id) {
  const { data, error } = await supabase
    .from(storeName)
    .select('*')
    .eq('id', id)
    .single();
  if (error) throw error;
  return data;
}
async function dbDelete(storeName, id) {
  const { error } = await supabase
    .from(storeName)
    .delete()
    .eq('id', id);
  if (error) throw error;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}
function formatDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

    list = list.filter(b =>
      (b.title && b.title.toLowerCase().includes(kw)) ||
      (b.device && b.device.toLowerCase().includes(kw)) ||
      (b.description && b.description.toLowerCase().includes(kw)) ||
      (b.id && `BUG-${String(b.id).padStart(3,'0')}`.includes(kw))

  if (filterState.type) list = list.filter(b => b.type === filterState.type);
  if (filterState.status) list = list.filter(b => b.status === filterState.status);

async function loadExistingAttachments(ids) {
  for (const aid of ids) {
    const att = await dbGet('attachments', aid);
    if (att) {
      draftAttachments.push({ id: att.id, name: att.name, size: att.size, type: att.type, blob: att.blob, existing: true });
    }
  }
  renderAttachList();
}

async function onFilesSelected(files) {
  const compress = document.getElementById('f_compress').checked;
  showProgress('处理附件...');
  for (const file of files) {
    let blob = file;
    if (compress && file.type.startsWith('video/') && file.size > 10 * 1024 * 1024) {
      try {
        updateProgress(10, `压缩视频: ${file.name}`);
        blob = await compressVideo(file);
        updateProgress(80, `压缩完成: ${file.name}`);
      } catch (e) {
        console.warn('视频压缩失败，使用原文件', e);
      }
    }
    draftAttachments.push({ name: file.name, size: blob.size, type: file.type, blob: blob });
  }
  hideProgress();
  renderAttachList();
  toast(`已添加 ${files.length} 个附件`);
}

function compressVideo(file) {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.src = URL.createObjectURL(file);
    video.muted = true;
    video.playsInline = true;
    video.onloadedmetadata = () => {
      let w = video.videoWidth, h = video.videoHeight;
      const maxW = 1280, maxH = 720;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      w = Math.floor(w / 2) * 2; h = Math.floor(h / 2) * 2;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 1500000
      });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        URL.revokeObjectURL(video.src);
        resolve(new Blob(chunks, { type: 'video/webm' }));
      };
      video.ontimeupdate = () => { ctx.drawImage(video, 0, 0, w, h); };
      video.onended = () => recorder.stop();
      video.play();
      recorder.start();
    };
    video.onerror = reject;
  });
}

async function saveBug() {
  const title = document.getElementById('f_title').value.trim();
  if (!title) { toast('请填写问题标题', 'error'); return; }

  const data = {
    title,
    device: document.getElementById('f_device').value.trim(),
    firmware: document.getElementById('f_firmware').value.trim(),
    appVersion: document.getElementById('f_appver').value.trim(),
    type: document.getElementById('f_type').value,
    severity: document.getElementById('f_severity').value,
    status: document.getElementById('f_status').value,
    tester: document.getElementById('f_tester').value.trim(),
    steps: document.getElementById('f_steps').value,
    expected: document.getElementById('f_expected').value,
    actual: document.getElementById('f_actual').value,
    description: document.getElementById('f_description').value,
    updatedAt: Date.now()
  };

  showProgress('保存中...');
  try {
    let bugId = currentEditId;
    if (bugId) {
      const old = await dbGet('bugs', bugId);
      data.id = bugId;
      data.createdAt = old.createdAt;
      data.attachmentIds = old.attachmentIds || [];
    } else {
      data.createdAt = Date.now();
      data.attachmentIds = [];
    }

    for (const att of draftAttachments) {
      if (att.existing) continue;
      const attId = await dbAdd('attachments', {
        name: att.name, size: att.size, type: att.type, blob: att.blob
      });
      data.attachmentIds.push(attId);
    }

    if (bugId) { await dbPut('bugs', data); }
    else { bugId = await dbAdd('bugs', data); }

    await loadBugs();
    hideProgress();
    toast('保存成功');
    switchView('list');
  } catch (e) {
    hideProgress();
    console.error(e);
    toast('保存失败: ' + e.message, 'error');
  }
}

function editBug(id) {
  const bug = currentBugs.find(b => b.id === id);
  if (bug) renderNewForm(bug);
}

async function deleteBug(id) {
  if (!confirm('确定删除这条问题记录吗？附件也会一并删除。')) return;
  const bug = await dbGet('bugs', id);
  if (bug && bug.attachmentIds) {
    for (const aid of bug.attachmentIds) {
      try { await dbDelete('attachments', aid); } catch(e) {}
    }
  }
  await dbDelete('bugs', id);
  await loadBugs();
  toast('已删除');
  if (currentView === 'detail') switchView('list');
  else renderTable();
}

// ==================== 导出功能 ====================
async function exportExcel() {
  const list = getFilteredBugs();
  if (list.length === 0) { toast('没有可导出的记录', 'error'); return; }
  showProgress('生成Excel...');

  const rows = list.map(b => ({
    '编号': `BUG-${String(b.id).padStart(3,'0')}`,
    '问题标题': b.title || '',
    '硬件设备': b.device || '',
    '固件版本': b.firmware || '',
    'APP版本': b.appVersion || '',
    '问题类型': (TYPE_MAP[b.type] || {}).label || b.type || '',
    '严重程度': (SEVERITY_MAP[b.severity] || {}).label || b.severity || '',
    '状态': (STATUS_MAP[b.status] || {}).label || b.status || '',
    '测试人员': b.tester || '',
    '复现步骤': b.steps || '',
    '预期结果': b.expected || '',
    '实际结果': b.actual || '',
    '问题描述': b.description || '',
    '附件数': (b.attachmentIds || []).length,
    '创建时间': formatDate(b.createdAt),
    '更新时间': b.updatedAt ? formatDate(b.updatedAt) : ''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [
    { wch: 10 }, { wch: 30 }, { wch: 18 }, { wch: 12 }, { wch: 12 },
    { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 },
    { wch: 40 }, { wch: 30 }, { wch: 30 }, { wch: 30 },
    { wch: 8 }, { wch: 16 }, { wch: 16 }
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '测试问题列表');
  XLSX.writeFile(wb, `测试问题列表_${new Date().toISOString().slice(0,10)}.xlsx`);

  hideProgress();
  toast(`已导出 ${list.length} 条记录`);
}

async function exportZip() {
  const list = getFilteredBugs();
  if (list.length === 0) { toast('没有可导出的记录', 'error'); return; }
  showProgress('打包中...');

  const zip = new JSZip();
  const rows = list.map(b => ({
    '编号': `BUG-${String(b.id).padStart(3,'0')}`,
    '问题标题': b.title || '',
    '硬件设备': b.device || '',
    '固件版本': b.firmware || '',
    'APP版本': b.appVersion || '',
    '问题类型': (TYPE_MAP[b.type] || {}).label || '',
    '严重程度': (SEVERITY_MAP[b.severity] || {}).label || '',
    '状态': (STATUS_MAP[b.status] || {}).label || '',
    '测试人员': b.tester || '',
    '复现步骤': b.steps || '',
    '预期结果': b.expected || '',
    '实际结果': b.actual || '',
    '问题描述': b.description || '',
    '附件数': (b.attachmentIds || []).length,
    '创建时间': formatDate(b.createdAt),
    '更新时间': b.updatedAt ? formatDate(b.updatedAt) : ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{ wch: 10 },{ wch: 30 },{ wch: 18 },{ wch: 12 },{ wch: 12 },{ wch: 10 },{ wch: 10 },{ wch: 10 },{ wch: 10 },{ wch: 40 },{ wch: 30 },{ wch: 30 },{ wch: 30 },{ wch: 8 },{ wch: 16 },{ wch: 16 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '测试问题列表');
  const excelBuf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  zip.file('测试问题列表.xlsx', excelBuf);

  const attFolder = zip.folder('附件');
  let attCount = 0;
  for (const b of list) {
    if (!b.attachmentIds || b.attachmentIds.length === 0) continue;
    const bugFolder = attFolder.folder(`BUG-${String(b.id).padStart(3,'0')}`);
    for (const aid of b.attachmentIds) {
      const att = await dbGet('attachments', aid);
      if (att) { bugFolder.file(att.name, att.blob); attCount++; }
    }
  }

  updateProgress(90, '正在生成压缩包...');
  const blob = await zip.generateAsync({ type: 'blob' });
  saveAs(blob, `测试问题打包_${new Date().toISOString().slice(0,10)}.zip`);
  hideProgress();
  toast(`已导出 ${list.length} 条记录 + ${attCount} 个附件`);
}

async function saveTestCase() {
  const title = document.getElementById('tc_title').value.trim();
  if (!title) { toast('请填写用例标题', 'error'); return; }
  const data = {
    title,
    module: document.getElementById('tc_module').value.trim(),
    type: document.getElementById('tc_type').value,
    priority: document.getElementById('tc_priority').value,
    status: document.getElementById('tc_status').value,
    precondition: document.getElementById('tc_precondition').value.trim(),
    steps: document.getElementById('tc_steps').value,
    expected: document.getElementById('tc_expected').value,
    executor: document.getElementById('tc_executor').value.trim(),
    notes: document.getElementById('tc_notes').value,
    updatedAt: Date.now()
  };
  try {
    if (editTestCaseId) {
      const old = await dbGet('testcases', editTestCaseId);
      data.id = editTestCaseId;
      data.createdAt = old.createdAt;
      await dbPut('testcases', data);
    } else {
      data.createdAt = Date.now();
      await dbAdd('testcases', data);
    }
    await loadTestCases();
    toast('保存成功');
    switchView('testcases');
  } catch (e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

function editTestCase(id) {
  const tc = currentTestCases.find(t => t.id === id);
  if (tc) renderTestCaseForm(tc);
}

async function deleteTestCase(id) {
  if (!confirm('确定删除这条测试用例吗？')) return;
  await dbDelete('testcases', id);
  await loadTestCases();
  toast('已删除');
  switchView('testcases');
}

// 智能解析固件更新日志
function parseFirmwareSpec() {
  const text = document.getElementById('fw_import_text').value.trim();
  if (!text) { toast('请先粘贴更新日志内容', 'error'); return; }

  // 提取版本号
  const verMatch = text.match(/[vV](\d+\.\d+(?:\.\d+)?)/);
  if (verMatch && !document.getElementById('fw_version').value) {
    document.getElementById('fw_version').value = verMatch[0];
  }

  // 分段提取：新功能 / 问题修复 / 性能优化 / 已知问题
  const lines = text.split('\n');
  let changelog = '', knownIssues = '';
  let currentSection = '';

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;

    if (/新功能|新增|Feature/.test(trimmed)) { currentSection = 'changelog'; continue; }
    if (/问题修复|修复|Fix|Bug修复/.test(trimmed)) { currentSection = 'changelog'; changelog += trimmed + '\n'; continue; }
    if (/性能优化|优化|Optimize/.test(trimmed)) { currentSection = 'changelog'; changelog += trimmed + '\n'; continue; }
    if (/已知问题|未解决|Known Issue/.test(trimmed)) { currentSection = 'known'; continue; }

    if (currentSection === 'changelog') changelog += trimmed + '\n';
    else if (currentSection === 'known') knownIssues += trimmed + '\n';
    else changelog += trimmed + '\n';
  }

  if (changelog.trim()) document.getElementById('fw_changelog').value = changelog.trim();
  if (knownIssues.trim()) document.getElementById('fw_knownIssues').value = knownIssues.trim();

  toast('解析完成，已自动填充字段');
}

async function saveFirmware() {
  const version = document.getElementById('fw_version').value.trim();
  if (!version) { toast('请填写固件版本号', 'error'); return; }
  const data = {
    version,
    hardware: document.getElementById('fw_hardware').value.trim(),
    releaseDate: document.getElementById('fw_releaseDate').value ? new Date(document.getElementById('fw_releaseDate').value).getTime() : Date.now(),
    author: document.getElementById('fw_author').value.trim(),
    fileSize: parseInt(document.getElementById('fw_fileSize').value) || 0,
    md5: document.getElementById('fw_md5').value.trim(),
    changelog: document.getElementById('fw_changelog').value,
    knownIssues: document.getElementById('fw_knownIssues').value,
    upgradeMethod: document.getElementById('fw_upgradeMethod').value,
    notes: document.getElementById('fw_notes').value,
    updatedAt: Date.now()
  };
  try {
    if (editFirmwareId) {
      const old = await dbGet('firmware', editFirmwareId);
      data.id = editFirmwareId;
      data.createdAt = old.createdAt;
      await dbPut('firmware', data);
    } else {
      data.createdAt = Date.now();
      await dbAdd('firmware', data);
    }
    await loadFirmware();
    toast('保存成功');
    switchView('firmware');
  } catch (e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

async function deleteFirmware(id) {

  await dbDelete('firmware', id);
  await loadFirmware();
  toast('已删除');
  switchView('firmware');
}

// 文件上传处理：根据类型读取内容并显示在文档预览区
async function handleFileUpload(input, targetTextareaId) {
  const file = input.files[0];
  if (!file) return;
  showProgress('正在读取文件...');
  let text = '';
  let isHtml = false;
  try {
    const ext = file.name.split('.').pop().toLowerCase();

    if (['txt', 'md', 'csv', 'json'].includes(ext)) {
      // 纯文本格式直接读取
      text = await file.text();
      isHtml = false;
    } else if (ext === 'docx') {
      // docx 用 mammoth 转成HTML，保留格式
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({ arrayBuffer });
      text = result.value;
      isHtml = true;
    } else if (ext === 'pdf') {
      // pdf 用 pdf.js 动态加载
      if (typeof pdfjsLib === 'undefined') {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
          script.onload = resolve;
          script.onerror = () => reject(new Error('PDF解析库加载失败'));
          document.head.appendChild(script);
        });
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n\n';
      }
      text = fullText;
    } else {
      toast('暂不支持该格式', 'error');
      hideProgress();
      return;
    }

    // 填充隐藏的原始文本存储
    document.getElementById(targetTextareaId).value = text;

    // 渲染到文档预览区
    const previewId = targetTextareaId.replace('_text', '_preview');
    const previewEl = document.getElementById(previewId);
    if (previewEl) {
      let html = '';
      if (isHtml) {
        // docx 转的HTML直接渲染
        html = `<div class="doc-content">${text}</div>`;
      } else {
        // 纯文本按换行分段
        html = text.split('\n').map(line => {
          if (!line.trim()) return '<div style="height:12px"></div>';
          if (/^\d+\.\s/.test(line.trim()) || /^第\d+[章节]/.test(line.trim())) {
            return `<div style="font-weight:600;margin-top:16px;margin-bottom:8px">${line}</div>`;
          }
          return `<div>${line}</div>`;
        }).join('');
      }
      previewEl.innerHTML = html;
    }

    hideProgress();
    toast(`已读取文件「${file.name}」，共 ${text.length} 字`);
  } catch (e) {

// 智能解析功能规格书文本
function parseFeatureSpec() {
  const text = document.getElementById('fs_import_text').value.trim();
  if (!text) { toast('请先粘贴文本内容', 'error'); return; }

  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  let name = '', version = '', description = '', io = '', rules = '', exceptions = '', acceptance = '';

  // 提取版本号
  const verMatch = text.match(/[vV](\d+\.\d+(?:\.\d+)?)/);
  if (verMatch) version = verMatch[0];

  // 第一行通常是标题
  if (lines.length > 0) {
    name = lines[0].replace(/^[#\-\*\d\.\s]+/, '').slice(0, 50);
  }

  // 分段提取
  let currentSection = '';
  for (const line of lines) {
    const lower = line.toLowerCase();
    if (/功能描述|功能说明|概述|简介/.test(line)) { currentSection = 'desc'; continue; }
    if (/输入.*输出|输入\/输出|输入输出|Input|Output/.test(line)) { currentSection = 'io'; continue; }
    if (/业务规则|功能规则|逻辑|条件/.test(line)) { currentSection = 'rules'; continue; }
    if (/异常|错误|失败|容错/.test(line)) { currentSection = 'exceptions'; continue; }
    if (/验收标准|通过标准|测试通过/.test(line)) { currentSection = 'acceptance'; continue; }

    if (currentSection === 'desc') description += line + '\n';
    else if (currentSection === 'io') io += line + '\n';
    else if (currentSection === 'rules') rules += line + '\n';
    else if (currentSection === 'exceptions') exceptions += line + '\n';
    else if (currentSection === 'acceptance') acceptance += line + '\n';
  }

  // 如果没提取到，整段作为描述
  if (!description && !io && !rules) {
    description = text.slice(0, 500);
  }

  // 填充到表单
  if (name && !document.getElementById('fs_name').value) document.getElementById('fs_name').value = name;
  if (version && !document.getElementById('fs_version').value) document.getElementById('fs_version').value = version;
  if (description.trim()) document.getElementById('fs_description').value = description.trim();
  if (io.trim()) document.getElementById('fs_io').value = io.trim();
  if (rules.trim()) document.getElementById('fs_rules').value = rules.trim();
  if (exceptions.trim()) document.getElementById('fs_exceptions').value = exceptions.trim();
  if (acceptance.trim()) document.getElementById('fs_acceptance').value = acceptance.trim();

  toast('解析完成，已自动填充字段');
}

function formatJson() {
  const input = document.getElementById('json_input').value.trim();
  if (!input) { toast('请输入JSON内容', 'error'); return; }
  try {
    const parsed = JSON.parse(input);
    const pretty = JSON.stringify(parsed, null, 2);
    document.getElementById('json_output').textContent = pretty;
    document.getElementById('json_result').style.display = 'block';
    toast('格式化完成');
  } catch (e) {
    toast('JSON格式错误: ' + e.message, 'error');
  }
}

function minifyJson() {
  const input = document.getElementById('json_input').value.trim();
  if (!input) { toast('请输入JSON内容', 'error'); return; }
  try {
    const parsed = JSON.parse(input);
    const compact = JSON.stringify(parsed);
    document.getElementById('json_output').textContent = compact;
    document.getElementById('json_result').style.display = 'block';
    toast('压缩完成');
  } catch (e) {
    toast('JSON格式错误: ' + e.message, 'error');
  }
}

function convertTimestamp() {
  const input = document.getElementById('ts_input').value.trim();
  if (!input) { toast('请输入时间戳', 'error'); return; }
  const ts = parseInt(input);
  if (isNaN(ts)) { toast('时间戳格式错误', 'error'); return; }
  // 自动判断是秒还是毫秒
  const ms = ts < 1e12 ? ts * 1000 : ts;
  const date = new Date(ms);
  if (isNaN(date.getTime())) { toast('无效的时间戳', 'error'); return; }
  const fmt = date.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('ts_date').innerHTML = `可读时间：<strong>${fmt}</strong>`;
  document.getElementById('ts_ms').innerHTML = `毫秒时间戳：<strong>${ms}</strong> &nbsp;|&nbsp; 秒时间戳：<strong>${Math.floor(ms/1000)}</strong>`;
  document.getElementById('ts_result').style.display = 'block';
}

function genPhone() {
  const prefixes = ['130','131','132','135','136','137','138','139','150','151','152','158','159','186','187','188','189'];
  const p = prefixes[Math.floor(Math.random() * prefixes.length)];
  let num = p;
  for (let i = 0; i < 8; i++) num += Math.floor(Math.random() * 10);
  document.getElementById('gen_output').textContent = num;
}

function genDeviceId() {
  const chars = '0123456789abcdef';
  let id = '';
  for (let i = 0; i < 12; i++) id += chars[Math.floor(Math.random() * 16)];
  document.getElementById('gen_output').textContent = id.toUpperCase();
}

function genUUID() {
  let uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
  document.getElementById('gen_output').textContent = uuid;
}

function genIp() {
  const ip = `${Math.floor(Math.random()*223)+1}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*254)+1}`;
  document.getElementById('gen_output').textContent = ip;
}

function calcStats() {
  const total = parseInt(document.getElementById('stat_total').value) || 0;
  const bugs = parseInt(document.getElementById('stat_bugs').value) || 0;
  const fixed = parseInt(document.getElementById('stat_fixed').value) || 0;
  const passed = parseInt(document.getElementById('stat_passed').value) || 0;

  if (total === 0) { toast('总用例数不能为0', 'error'); return; }

  const bugRate = (bugs / total * 100).toFixed(1);
  const fixRate = bugs > 0 ? (fixed / bugs * 100).toFixed(1) : 0;
  const passRate = (passed / total * 100).toFixed(1);

  const html = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div style="padding:10px 12px;background:var(--main-bg);border-radius:8px;text-align:center">
        <div style="font-size:20px;font-weight:700;color:var(--danger)">${bugRate}%</div>
        <div style="font-size:11px;color:var(--text-secondary)">缺陷率</div>
      </div>
      <div style="padding:10px 12px;background:var(--main-bg);border-radius:8px;text-align:center">
        <div style="font-size:20px;font-weight:700;color:var(--success)">${fixRate}%</div>
        <div style="font-size:11px;color:var(--text-secondary)">修复率</div>
      </div>
      <div style="padding:10px 12px;background:var(--main-bg);border-radius:8px;text-align:center">
        <div style="font-size:20px;font-weight:700;color:var(--accent)">${passRate}%</div>
        <div style="font-size:11px;color:var(--text-secondary)">用例通过率</div>
      </div>
      <div style="padding:10px 12px;background:var(--main-bg);border-radius:8px;text-align:center">
        <div style="font-size:20px;font-weight:700">${fixed}/${bugs}</div>
        <div style="font-size:11px;color:var(--text-secondary)">已修/总缺陷</div>
      </div>
    </div>
  `;
  document.getElementById('stat_result').innerHTML = html;
  document.getElementById('stat_result').style.display = 'block';
}

function doAddUser() {
  const username = document.getElementById('nu_username').value.trim();
  const name = document.getElementById('nu_name').value.trim();
  const role = document.getElementById('nu_role').value;
  const password = document.getElementById('nu_password').value.trim();
  const email = document.getElementById('nu_email').value.trim();
  if (!username || !name) { toast('请填写账号和姓名', 'error'); return; }
  if (USERS.find(u => u.username === username)) { toast('账号已存在', 'error'); return; }
  if (password.length < 6) { toast('密码至少6位', 'error'); return; }
  USERS.push({ username, name, role, password, email });
  saveUsers();
  closeModal('addUserModal');
  toast('用户创建成功');
  renderUserMgmtView();
}

function resetUserPassword(idx) {
  const user = USERS[idx];
  if (confirm(`确定重置用户「${user.name}」的密码为 123456 吗？`)) {
    user.password = '123456';
    saveUsers();
    toast('密码已重置为 123456');
  }
}

function deleteUser(idx) {
  const user = USERS[idx];
  if (confirm(`确定删除用户「${user.name}」吗？此操作不可恢复。`)) {
    USERS.splice(idx, 1);
    saveUsers();
    toast('用户已删除');
    renderUserMgmtView();
  }
}

function renderCompatListView() {

  document.getElementById('pageSubtitle').textContent = `共 ${currentCompatList.length} 个机型适配记录`;
  document.getElementById('headerActions').innerHTML = `
    <button class="btn btn-primary" onclick="switchView('compatNew')">+ 新增适配</button>
  `;
  const content = document.getElementById('content');
  if (currentCompatList.length === 0) {
    content.innerHTML = `<div class="form-card"><div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
      <p>还没有系统适配记录，点击右上角"新增适配"开始</p>
    </div></div>`;
    return;
  }
  content.innerHTML = `
    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:150px"><col style="width:100px"><col style="width:100px">
          <col style="width:120px"><col style="width:100px"><col style="width:200px">
          <col style="width:100px"><col style="width:100px">
        </colgroup>
        <thead><tr>
          <th>机型</th><th>系统</th><th>系统版本</th>
          <th>品牌</th><th>适配状态</th><th>问题描述</th><th>测试人</th><th>操作</th>
        </tr></thead>
        <tbody>
          ${currentCompatList.map(c => {
            const os = COMPAT_OS[c.os] || COMPAT_OS.other;
            const st = COMPAT_STATUS[c.status] || COMPAT_STATUS.compatible;
            return `<tr>
              <td style="font-weight:600">${escapeHtml(c.model)}</td>
              <td><span class="badge ${os.cls}">${os.label}</span></td>
              <td>${escapeHtml(c.osVersion) || '-'}</td>
              <td>${escapeHtml(c.brand) || '-'}</td>
              <td><span class="badge ${st.cls}">${st.label}</span></td>
              <td title="${escapeHtml(c.issue)}" style="color:var(--text-secondary)">${escapeHtml(c.issue) || '-'}</td>
              <td>${escapeHtml(c.tester) || '-'}</td>
              <td>
                <button class="btn btn-sm btn-secondary" onclick="editCompat(${c.id})">编辑</button>
                <button class="btn btn-sm btn-danger" onclick="deleteCompat(${c.id})">删除</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderCompatForm(c = null) {
  editCompatId = c ? c.id : null;
  document.getElementById('pageTitle').textContent = c ? '编辑适配记录' : '新增适配记录';
  document.getElementById('pageSubtitle').textContent = '记录各手机系统/机型的APP适配情况';
  document.getElementById('headerActions').innerHTML = `
    <button class="btn btn-secondary" onclick="switchView('compat')">取消</button>
    <button class="btn btn-primary" onclick="saveCompat()">保存</button>
  `;
  const data = c || {};
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="form-card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">机型名称<span class="req">*</span></label>
          <input class="form-input" id="cm_model" placeholder="如：小米14 / iPhone 15 Pro / 华为Mate 60" value="${escapeHtml(data.model||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">系统类型</label>
          <select class="form-select" id="cm_os">
            ${Object.entries(COMPAT_OS).map(([k,v]) => `<option value="${k}" ${(data.os||'android')===k?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">系统版本</label>
          <input class="form-input" id="cm_osVersion" placeholder="如：Android 14 / iOS 17 / HarmonyOS 4" value="${escapeHtml(data.osVersion||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">品牌</label>
          <input class="form-input" id="cm_brand" placeholder="如：小米 / 苹果 / 华为 / 三星" value="${escapeHtml(data.brand||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">适配状态</label>
          <select class="form-select" id="cm_status">
            ${Object.entries(COMPAT_STATUS).map(([k,v]) => `<option value="${k}" ${(data.status||'compatible')===k?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">测试人</label>
          <input class="form-input" id="cm_tester" placeholder="测试人姓名" value="${escapeHtml(data.tester||'')}">
        </div>
        <div class="form-group full">
          <label class="form-label">问题描述</label>
          <textarea class="form-textarea" id="cm_issue" placeholder="如：蓝牙连接偶尔断开 / 相机权限申请闪退...">${escapeHtml(data.issue||'')}</textarea>
        </div>
        <div class="form-group full">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="cm_notes" placeholder="补充说明...">${escapeHtml(data.notes||'')}</textarea>
        </div>
      </div>
    </div>
  `;
}

async function saveCompat() {
  const model = document.getElementById('cm_model').value.trim();
  if (!model) { toast('请填写机型名称', 'error'); return; }
  const data = {
    model,
    os: document.getElementById('cm_os').value,
    osVersion: document.getElementById('cm_osVersion').value.trim(),
    brand: document.getElementById('cm_brand').value.trim(),
    status: document.getElementById('cm_status').value,
    tester: document.getElementById('cm_tester').value.trim(),
    issue: document.getElementById('cm_issue').value,
    notes: document.getElementById('cm_notes').value,
    updatedAt: Date.now()
  };
  try {
    if (editCompatId) {
      const old = await dbGet('compat', editCompatId);
      data.id = editCompatId;
      data.createdAt = old.createdAt;
      await dbPut('compat', data);
    } else {
      data.createdAt = Date.now();
      await dbAdd('compat', data);
    }
    await loadCompat();
    toast('保存成功');
    switchView('compat');
  } catch (e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

function editCompat(id) {
  const c = currentCompatList.find(x => x.id === id);
  if (c) renderCompatForm(c);
}

async function deleteCompat(id) {
  if (!confirm('确定删除这条适配记录吗？')) return;
  await dbDelete('compat', id);
  await loadCompat();
  toast('已删除');
  switchView('compat');
}

// ==================== 启动 ====================
async function initApp() {
  try {
    await loadBugs();
    await loadTestCases();
    await loadFirmware();
    await loadFeatureSpecs();
    await loadUIReviews();
    await loadScripts();
    await loadCompat();
  } catch (e) {
    console.error('数据库连接失败:', e);
    alert('数据库连接失败，请先在 Supabase 中创建对应的数据表。\n\n错误信息: ' + e.message);
  }
  updateAllBadges();
  switchView('stats');
}

function updateAllBadges() {
  document.getElementById('navCountBugs').textContent = currentBugs.length;
  document.getElementById('navCountCases').textContent = currentTestCases.length;
  document.getElementById('navCountFirmware').textContent = currentFirmwareList.length;
  document.getElementById('navCountFeatures').textContent = currentFeatureSpecs.length;
  document.getElementById('navCountUI').textContent = currentUIReviews.length;
  document.getElementById('navCountScripts').textContent = currentScripts.length;
  document.getElementById('navCountCompat').textContent = currentCompatList.length;
}

// 启动时先检查登录
if (checkLogin()) {
  document.getElementById('mainApp').style.display = 'flex';
  initApp();
} else {
  showLogin();
}
</script>
</body>
</html>
